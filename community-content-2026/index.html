<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:image" content="og.png">
</head>
<body>
<title>סקר קהילת ליגל מיינד</title>
<meta name="description" content="11 שאלות קצרות שיעזרו לנו להחליט אילו מדריכים, סרטונים ועדכונים להכין לקהילה.">
<meta property="og:title" content="סקר קהילת ליגל מיינד">
<meta property="og:description" content="11 שאלות קצרות שיעזרו לנו להחליט אילו מדריכים, סרטונים ועדכונים להכין לקהילה.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Frank+Ruhl+Libre:wght@700;900&family=Heebo:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Amatic+SC:wght@700&display=swap">
<style>
/* Layout: a working desk seen from above. Top rail + bottom rail frame every page; each question pairs a live object (prop) with the answers. */
:root{
  --paper:#F1F9F8;      /* very light turquoise ground, keeps the logo in its true colours */
  --sheet:#FFFFFF;
  --ink:#13233A;        /* logo navy */
  --ink-2:#4A5A6E;
  --teal-d:#0A8686;     /* logo teal, dark */
  --teal:#0BB5AD;       /* logo teal, mid */
  --teal-l:#3DDCD8;     /* logo teal, light */
  --mint:#CDF3F0;       /* selection fill */
  --kraft:#D9B98A;      /* case folder */
  --kraft-d:#B8945F;
  --stamp:#A4432F;      /* rubber-stamp red, from the landing page */
  --wood:#8A5A34;
  --note:#FFF1A6;
  --line:rgba(19,35,58,.16);
  --display:"Karantina","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,sans-serif;
  --mono:"IBM Plex Mono","Heebo",ui-monospace,monospace;
  --hand:"Amatic SC","Heebo",cursive;
  --gut:clamp(16px,4vw,56px);
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{direction:rtl;margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.ltr{direction:ltr;unicode-bidi:isolate}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}

/* ---------- frame ---------- */
.app{position:fixed;inset:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  background-color:var(--paper);background-image:radial-gradient(rgba(19,35,58,.14) 1px,transparent 1.3px);background-size:18px 18px}
.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gut);font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-2);background:var(--paper);position:relative;z-index:5}
.rail-top{border-bottom:1.5px solid var(--ink)}
.rail-top .logo{height:28px;width:auto;display:block}
.rail-top .meta{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counter{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rail-bottom{border-top:1.5px solid var(--ink);padding-block:10px}
.rail-bottom[hidden]{display:none}
.ticks{display:flex;gap:4px;flex:1;max-width:340px;margin-inline:16px}
.ticks i{flex:1;height:7px;border-radius:4px;border:1.5px solid var(--ink);background:transparent;transition:background .4s var(--ease)}
.ticks i.on{background:var(--teal-l)}
.demo-flag{position:absolute;top:100%;left:50%;transform:translate(-50%,8px);background:var(--ink);color:#fff;font-family:var(--mono);font-size:12px;padding:3px 10px;white-space:nowrap}

/* ---------- pages ---------- */
.pages{position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:clamp(14px,3vh,36px) var(--gut);
  opacity:0;visibility:hidden;transform:translateX(-36px);transition:opacity .45s var(--ease),transform .55s var(--ease),visibility 0s .55s}
.page.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s var(--ease),transform .55s var(--ease)}
.page.out{opacity:0;visibility:visible;transform:translateX(36px)}
.page.rev{transform:translateX(36px)}
.page.rev.out{transform:translateX(-36px)}

/* ---------- type ---------- */
.eyebrow{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--teal-d);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor}
.title{font-family:var(--display);font-weight:700;line-height:.95;margin:0;font-size:clamp(54px,9.5vw,96px);letter-spacing:-.005em;text-wrap:balance}
.sub{margin:0;font-size:clamp(17px,1.6vw,19px);line-height:1.6;color:var(--ink-2);max-width:56ch}
mark.hl{color:inherit;background:linear-gradient(transparent 52%,var(--teal-l) 52%,var(--teal-l) 90%,transparent 90%) no-repeat 100% 0/0% 100%;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding-inline:.04em}
.on mark.hl{animation:marker .8s .35s var(--ease) forwards}
@keyframes marker{to{background-size:100% 100%}}
.hand{font-family:var(--hand);font-weight:700;font-size:30px;line-height:1;color:var(--ink)}

/* ---------- buttons ---------- */
.btn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:14px;background:var(--sheet);color:var(--ink);
  font-family:var(--body);font-weight:700;font-size:18px;padding:12px 22px;min-height:48px;box-shadow:0 4px 0 var(--ink);transition:transform .15s var(--ease),box-shadow .15s var(--ease),background .2s;text-decoration:none}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-go{background:var(--teal-l)}
.btn-go.ready{animation:nudge 1.6s var(--ease) infinite}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translateX(-4px)}90%{transform:translateX(0)}}
.btn:disabled{cursor:not-allowed;background:transparent;color:rgba(19,35,58,.4);border-style:dashed;border-color:rgba(19,35,58,.35);box-shadow:none}
.btn-quiet{border-color:transparent;box-shadow:none;background:transparent;font-weight:500;padding-inline:8px}
.btn-quiet:hover:not(:disabled){box-shadow:none;transform:none;text-decoration:underline}

/* ---------- question layout ---------- */
.q-grid{min-height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:clamp(10px,2vh,22px);max-width:1180px;margin-inline:auto}
.prop-zone{position:relative;height:clamp(200px,33vh,320px);container-type:size;display:grid;place-items:center;pointer-events:none}
.q-main{display:flex;flex-direction:column;gap:clamp(12px,2vh,20px);align-content:start;min-width:0;padding-bottom:12px}
@media (min-width:900px){
  .q-grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);grid-template-rows:1fr;align-items:center;gap:clamp(24px,4vw,64px)}
  .prop-zone{order:2;height:min(62vh,560px)}
  .q-main{order:1;padding-bottom:0}
}
.prop-zone.none{display:none}
@media (min-width:900px){ .q-grid.solo{grid-template-columns:minmax(0,760px);justify-content:center} }

/* ---------- options ---------- */
.opts{display:grid;gap:10px}
.opts.cards{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:start;cursor:pointer;background:linear-gradient(180deg,#FFFFFF,#F6FBFB);border:1.5px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink),0 8px 16px rgba(19,35,58,.08);margin-bottom:4px;
  padding:15px 16px;min-height:56px;font-size:clamp(17px,1.5vw,19px);font-weight:500;line-height:1.35;transition:background .2s,transform .18s var(--ease),box-shadow .18s var(--ease)}
.on .opt{animation:rise .5s var(--ease) backwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.opt:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink),0 12px 20px rgba(19,35,58,.10)}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt[aria-checked="true"]{background:linear-gradient(180deg,#E2FAF8,var(--mint));box-shadow:0 2px 0 var(--ink),0 0 0 4px rgba(61,220,216,.35);transform:translateY(2px)}
.key{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:8px;font-family:var(--mono);font-size:14px;font-weight:600;background:var(--paper);transition:background .2s}
.opt[aria-checked="true"] .key{background:var(--ink);color:#fff}
.ico{flex:none;width:34px;height:34px;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);border-radius:9px}
.ico svg{width:22px;height:22px}
.opt .tick{margin-inline-start:auto;font-weight:800;opacity:0;transform:scale(.5);transition:.25s var(--spring)}
.opt[aria-checked="true"] .tick{opacity:1;transform:none}
.opts.cards .opt{flex-direction:column;align-items:flex-start;min-height:104px;justify-content:space-between}
.opts.cards .opt .tick{position:absolute;top:12px;inset-inline-end:14px}
.opts.chips{display:flex;flex-wrap:wrap}
.opts.chips .opt{width:auto;border-radius:999px;padding:11px 20px}
.opts.chips .opt .key{display:none}
.other-wrap{display:none}
.other-wrap.show{display:block}
.other-hint{margin:8px 2px 0;font-size:15px;color:var(--ink-2)}
.other-hint b{color:var(--ink);background:var(--mint);border-radius:6px;padding:1px 6px;white-space:nowrap}
.other-in,.field input,.open-in{width:100%;border:1.5px solid var(--ink);background:var(--sheet);padding:14px 15px;font-size:18px;outline:none;border-radius:12px;transition:box-shadow .2s}
.other-in:focus,.field input:focus,.open-in:focus{box-shadow:0 0 0 4px rgba(61,220,216,.45)}
.err{min-height:1.3em;color:var(--stamp);font-weight:600;font-size:15px}
.hint{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.scale .opt{justify-content:center;padding:14px 0;font-family:var(--mono);font-weight:600;font-size:19px}
.scale-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.open-in{min-height:140px;resize:vertical;line-height:1.7}
@media (max-width:560px){ .opts.cards{grid-template-columns:1fr} .opts.cards .opt{min-height:0;flex-direction:row;align-items:center} .opts.cards .opt .tick{position:static} .scale{grid-template-columns:repeat(5,minmax(0,1fr))} }

/* ---------- welcome ---------- */
.page.welcome{padding-block:0}
.hero{width:100%;max-width:1180px;min-height:100%;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:clamp(28px,5vh,48px);padding-block:clamp(28px,5vh,56px)}
.hero-visual{display:flex;justify-content:center;container-type:inline-size;width:min(100%,430px);margin-inline:auto}
.hero-visual .prop{font-size:calc(100cqw / 23)}
.hero-copy{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(16px,2.6vh,26px);min-width:0}
.hero-copy>*{max-width:100%}
.hero-head{font-family:var(--display);font-weight:700;font-size:clamp(60px,15vw,128px);line-height:.9;margin:0;text-wrap:balance;letter-spacing:-.005em}
.hero-head .ltr{color:var(--teal-d)}
.hero-q{font-family:var(--display);font-weight:700;font-size:clamp(34px,7.4vw,58px);line-height:1;margin:0;color:var(--ink)}
.hero-cta{display:flex;flex-direction:column;align-items:center;gap:22px;margin-top:6px}
.hero-cta .hand{transform:rotate(-2deg);position:relative}
.hero-cta .hand svg{position:absolute;inset-inline:0;bottom:-8px;width:100%;height:10px}
.hero-cta .hand path{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200}
.on .hero-cta .hand path{animation:draw 1s 1.2s var(--ease) forwards}
@media (min-width:900px){
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:clamp(30px,5vw,80px)}
  .hero-copy{order:1;align-items:flex-start;text-align:start}
  .hero-visual{order:2;width:min(100%,520px)}
  .hero-cta{align-items:flex-start}
}

/* ---------- details & thanks ---------- */
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .row2{grid-template-columns:1fr} }
.field label{display:block;font-weight:700;font-size:16px;margin-bottom:6px}
.field .req{color:var(--teal-d)}
.field input[type=email],.field input[type=tel]{direction:ltr;text-align:right}
.field.bad input{border-color:var(--stamp);box-shadow:4px 4px 0 rgba(164,67,47,.25)}
.consent{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:17px;line-height:1.55}
.consent input{appearance:none;flex:none;width:28px;height:28px;margin:2px 0 0;border:2px solid var(--ink);border-radius:8px;background:var(--sheet);display:grid;place-items:center;cursor:pointer}
.consent input::after{content:"";width:12px;height:7px;border-inline-start:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(-45deg) scale(0);margin-top:-3px;transition:.2s var(--spring)}
.consent input:checked{background:var(--teal-l)}
.consent input:checked::after{transform:rotate(-45deg) scale(1)}
.link{background:none;border:0;padding:0;color:var(--teal-d);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.notice{margin:0;font-size:15px;line-height:1.6;color:var(--ink-2)}
.missing{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}

.thanks .q-main{gap:16px}
.ends{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
@media (max-width:620px){ .ends{grid-template-columns:1fr} }
.end{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.end .e-eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--teal-d)}
.end h3{margin:0;font-size:19px}
.end p{margin:0;font-size:16px;line-height:1.55;color:var(--ink-2)}
.end a{align-self:flex-start;margin-top:4px;font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--teal-l);padding-bottom:1px;display:inline-flex;gap:8px;align-items:center}
.end a:hover{border-color:var(--ink)}
.end svg{width:20px;height:20px}

/* ---------- privacy modal ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(19,35,58,.55)}
.modal[hidden]{display:none}
.modal-box{background:var(--sheet);border:2px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 var(--ink);max-width:680px;width:100%;max-height:84vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1.5px solid var(--ink);background:var(--mint);font-family:var(--mono);font-size:13px}
.modal-body{overflow-y:auto;padding:18px 22px;line-height:1.75;font-size:17px}
.modal-body h1{font-family:var(--display);font-size:44px;line-height:1;margin:0 0 6px}
.modal-body h2{font-size:17px;margin:18px 0 4px;color:var(--teal-d)}
.modal-foot{padding:12px 14px;border-top:1.5px solid var(--line)}

/* =================== PROPS =================== */
.prop{position:relative;font-size:min(4.3cqh,6.2cqw)}
/* each object fills its zone: sizes are tuned to the object's own proportions */
.p-folder{font-size:min(6cqh,4.8cqw)}.p-dialog{font-size:min(6.4cqh,4.8cqw)}.p-laptop{font-size:min(5.4cqh,4.4cqw)}
.p-stamp{font-size:min(6.6cqh,5.4cqw)}.p-scales{font-size:min(4.4cqh,4.7cqw)}.p-chat{font-size:min(5.6cqh,5cqw)}
.p-keys{font-size:min(4.8cqh,4.1cqw)}.p-cal{font-size:min(4.6cqh,6cqw)}.p-contract{font-size:min(4.3cqh,6cqw)}.p-note{font-size:min(5.6cqh,6cqw)}
.p-gavel{font-size:min(5.6cqh,5.4cqw)}.p-card{font-size:min(5.2cqh,4.1cqw)}
.btn{white-space:nowrap}.ticks{min-width:0}
@media (max-width:420px){.rail-bottom .ticks{margin-inline:8px}.rail-bottom .btn{padding-inline:16px}}
.idle-swing{transform-origin:50% 0;animation:swing 5.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(2.6deg)}50%{transform:rotate(-2.6deg)}}
.bump{animation:bump 1.2s var(--ease)}
@keyframes bump{0%{transform:rotate(0)}20%{transform:rotate(-7deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:scale(.7) rotate(-6deg)}}

/* membership card: a community member card (photo, name, member since, entry QR, gold seal). Floats in 3D, flips to the member profile when an answer lands. */
.p-card{width:22em;perspective:70em;position:relative;padding-bottom:1.6em}
.p-card::after{content:"";position:absolute;left:12%;right:12%;bottom:0;height:1.2em;border-radius:50%;background:radial-gradient(closest-side,rgba(19,35,58,.28),transparent);filter:blur(.2em);animation:floor 7s ease-in-out infinite}
@keyframes floor{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.86);opacity:.6}}
.mc{position:relative;width:22em;height:13.87em;transform-style:preserve-3d;transition:transform 1.1s var(--spring);animation:hover3d 7s ease-in-out infinite}
.p-card.back .mc{transform:rotateY(180deg)}
@keyframes hover3d{0%,100%{rotate:x 9deg;translate:0 0}25%{rotate:y -11deg}50%{rotate:x -4deg;translate:0 -.5em}75%{rotate:y 10deg}}
.mc-face{position:absolute;inset:0;border-radius:1em;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 1.2em 2.4em rgba(19,35,58,.24),0 .2em .5em rgba(19,35,58,.14),inset 0 0 0 .07em rgba(19,35,58,.14),inset 0 .12em 0 rgba(255,255,255,.95)}
.mc-front{background:radial-gradient(120% 100% at 0% 100%,#E3F6F4 0%,#FFFFFF 55%);display:grid;grid-template-columns:6.4em 1fr;grid-template-rows:2.9em 1fr 2em}
.mc-head{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 1.1em;background:linear-gradient(90deg,var(--teal-d),var(--teal) 55%,var(--teal-l));position:relative;overflow:hidden}
.mc-head::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 .3em,transparent .3em .7em)}
.mc-head span{position:relative;z-index:1;font-weight:800;font-size:.82em;color:#fff;letter-spacing:.02em}
.mc-head .ltr{font-family:var(--mono);font-weight:600;font-size:.6em;letter-spacing:.16em;opacity:.95}
.mc-photo{grid-row:2/3;margin:.8em 0 .4em 0;margin-inline-start:1em;border-radius:.5em;background:linear-gradient(180deg,#E6F7F6,#C4ECE9);border:.1em solid rgba(19,35,58,.18);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;position:relative}
.mc-photo svg{width:4.6em}
.mc-photo .av-head,.mc-photo .av-body{fill:var(--ink)}
.mc-photo .av-collar{fill:#fff}
.mc-photo .av-tie{fill:var(--teal-d)}
.mc-info{grid-row:2/3;padding:.75em 1em .3em;display:flex;flex-direction:column;gap:.15em;min-width:0;position:relative}
.mc-info img{height:1.25em;width:auto;align-self:flex-start;margin-bottom:.35em}
.mc-label{font-family:var(--mono);font-size:.5em;letter-spacing:.12em;color:var(--ink-2)}
.mc-name{font-family:var(--display);font-weight:700;font-size:1.95em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.mc-name.empty{color:rgba(19,35,58,.3)}
.mc-meta{display:flex;gap:1.2em;margin-top:.35em}
.mc-meta span{font-family:var(--mono);font-size:.5em;color:var(--ink-2);letter-spacing:.06em}
.mc-meta b{display:block;font-family:var(--body);font-size:1.6em;color:var(--ink);letter-spacing:0}
.mc-seal{direction:ltr;unicode-bidi:isolate;position:absolute;top:.9em;left:.9em;width:3.6em;height:3.6em;filter:drop-shadow(0 .12em .15em rgba(120,90,30,.35));animation:sealspin 18s linear infinite}
@keyframes sealspin{to{transform:rotate(360deg)}}

.mc-seal .inner{fill:none;stroke:#8A6A24;stroke-width:1.4;stroke-dasharray:2 2.4}
.mc-seal text{font-family:"IBM Plex Mono",monospace;font-size:7.4px;font-weight:600;fill:#5E4512;letter-spacing:.9px}
.mc-seal .scale{fill:none;stroke:#5E4512;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mc-qr{position:absolute;bottom:2.45em;inset-inline-end:1.15em;width:3em;height:3em;display:grid;grid-template-columns:repeat(9,1fr);gap:.05em;padding:.22em;background:#fff;border:.08em solid rgba(19,35,58,.22);border-radius:.3em;z-index:2}
.mc-qr i{background:var(--ink);border-radius:.04em}
.mc-qr i.o{background:transparent}
.mc-art{position:absolute;inset:2.9em 0 2em;width:100%;height:calc(100% - 4.9em);pointer-events:none}
.mc-art .g{fill:none;stroke:var(--teal);stroke-width:.5;opacity:.35}
.mc-art .w{fill:none;stroke-linecap:round}
.mc-photo,.mc-info,.mc-foot{position:relative;z-index:1}
.mc-foot{grid-column:1/3;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:space-between;padding:0 1.1em;border-top:.08em dashed rgba(19,35,58,.2);font-family:var(--mono);font-size:.5em;color:var(--ink-2);letter-spacing:.1em}
.mc-sheen{position:absolute;inset:-50% -40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.75) 49%,rgba(255,255,255,.15) 53%,transparent 58%);animation:sheen 6.5s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes sheen{0%,55%{transform:translateX(55%)}80%,100%{transform:translateX(-55%)}}
.mc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#F7FDFD,#E2F6F4);display:flex;flex-direction:column}
.mc-back .mc-head{height:2.9em;flex:none}
.mc-sign{margin:.8em 1.1em .5em;flex:1;border-radius:.45em;padding:.6em .8em;background:repeating-linear-gradient(135deg,#FFFFFF 0 .45em,#F0F9F8 .45em .9em);box-shadow:inset 0 0 0 .07em rgba(19,35,58,.18)}
.mc-sign .b-fields{display:grid;grid-template-columns:1fr 1fr;gap:.35em .9em}
.mc-sign .sf-value{font-family:var(--hand);font-size:1.25em;font-weight:700;line-height:1.05}
.mc-back .mc-foot{height:2em;flex:none}
.b-fields{display:flex;flex-direction:column;gap:.45em;min-width:0}
.sf{border-bottom:.08em dashed rgba(19,35,58,.3);padding-bottom:.2em;min-width:0}
.sf-label{display:block;font-family:var(--mono);font-size:.55em;letter-spacing:.08em;color:var(--ink-2)}
.sf-value{display:block;font-weight:700;font-size:.8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-current .sf-label{color:var(--teal-d)}
.sf-pop .sf-value{animation:sfpop .7s var(--spring)}
@keyframes sfpop{0%{background:var(--teal-l);transform:scale(.6)}100%{background:transparent;transform:none}}

/* folder */
.p-folder{width:20em;height:15em;position:relative}
.p-folder .f-back{position:absolute;inset:1.6em 0 0;background:var(--kraft-d);border-radius:.4em}
.p-folder .f-tab{position:absolute;top:-1.6em;inset-inline-start:1.2em;height:1.7em;padding:0 1em;background:var(--kraft-d);border-radius:.4em .4em 0 0;font-family:var(--mono);font-size:.62em;display:flex;align-items:center;color:#3B2A12;font-weight:600}
.p-folder .f-paper{position:absolute;inset:.4em 1.2em 3em;background:#fff;box-shadow:0 .2em .6em rgba(0,0,0,.15);padding:.9em 1em;display:flex;flex-direction:column;gap:.5em;animation:peek 6s ease-in-out infinite}
@keyframes peek{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5em)}}
.p-folder .f-title{font-family:var(--mono);font-size:.62em;font-weight:600;letter-spacing:.08em;border-bottom:.12em solid var(--ink);padding-bottom:.4em}
.p-folder .f-front{position:absolute;inset:6.4em 0 0;background:linear-gradient(180deg,var(--kraft),#CFAD7B);border-radius:.3em .3em .4em .4em;box-shadow:0 -.1em .3em rgba(0,0,0,.12),0 1.2em 2em rgba(19,35,58,.18)}
.p-folder .f-front span{position:absolute;bottom:1.1em;inset-inline-end:1.2em;border:.16em solid var(--stamp);color:var(--stamp);font-weight:800;font-size:1em;padding:.1em .6em;transform:rotate(-8deg);opacity:.85;letter-spacing:.1em}

/* dialog */
.p-dialog{width:19em;position:relative;animation:popin .6s var(--spring) .2s both;transform:rotate(2.5deg)}
.d-win{background:#fff;border:.13em solid var(--ink);box-shadow:.35em .35em 0 var(--ink)}
.d-bar{display:flex;align-items:center;gap:.6em;padding:.4em .7em;background:var(--teal-l);border-bottom:.13em solid var(--ink);font-family:var(--mono);font-size:.62em;font-weight:600}
.d-dots{display:flex;gap:.35em;direction:ltr}
.d-dots i{width:.75em;height:.75em;border:.12em solid var(--ink);border-radius:50%;background:#fff}
.d-body{display:flex;gap:.8em;align-items:flex-start;padding:1em 1em .6em}
.d-icon{flex:none;width:2.2em;height:2em;display:grid;place-items:end center;font-weight:900;font-size:1em;color:#fff;background:var(--ink);clip-path:polygon(50% 0,100% 100%,0 100%);padding-bottom:.15em}
.d-msg{margin:0;font-size:.82em;line-height:1.45}
.d-actions{display:flex;justify-content:flex-start;padding:0 1em .9em}
.d-btn{border:.12em solid var(--ink);padding:.2em 1.4em;font-size:.75em;font-weight:700;background:var(--paper);transition:background .15s}
.d-cursor{position:absolute;width:1.9em;fill:#fff;stroke:var(--ink);stroke-width:1.6;left:70%;top:110%;animation:cursor 5s var(--ease) 1s infinite}
@keyframes cursor{0%{left:78%;top:118%}35%,55%{left:calc(100% - 4.2em);top:calc(100% - 1.6em)}45%{transform:scale(.82)}50%{transform:none}100%{left:78%;top:118%}}
.p-dialog.ping .d-win{animation:shake .5s var(--ease)}
@keyframes shake{25%{transform:translateX(-.3em)}50%{transform:translateX(.3em)}75%{transform:translateX(-.15em)}}

/* stamp */
.p-stamp{width:17em;height:13em;position:relative}
.s-paper{position:absolute;inset:0;background:#fff;transform:rotate(-3deg);box-shadow:0 1em 2em rgba(19,35,58,.18);padding:1.6em 1.4em;display:flex;flex-direction:column;gap:.8em}
.s-paper i{display:block;height:.45em;background:#E3E9EE}
.s-paper i:nth-child(2){width:80%}.s-paper i:nth-child(3){width:90%}.s-paper i:nth-child(4){width:55%}
.s-mark{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-12deg);border:.28em double var(--stamp);color:var(--stamp);padding:.2em .8em;font-family:var(--display);font-weight:700;font-size:2.6em;letter-spacing:.04em;opacity:.88;white-space:nowrap;mix-blend-mode:multiply}
.on .s-mark,.s-mark.slam{animation:slam .55s var(--spring) .3s both}
@keyframes slam{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2)}60%{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(.94)}100%{opacity:.88;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}

/* scales of justice */
.p-scales{width:19em}
.p-scales svg{width:100%;overflow:visible}
.p-scales .st{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.p-scales .bowl{fill:var(--teal-l);stroke:var(--ink);stroke-width:4}
.p-scales .knob{fill:var(--teal-d);stroke:var(--ink);stroke-width:4}
.p-scales .base{fill:var(--ink)}
.p-scales .beam{transform-box:view-box;transform-origin:120px 44px;transform:rotate(var(--tilt,0deg));transition:transform 1.1s var(--spring)}
.p-scales .pan-r{transform-box:view-box;transform-origin:204px 44px;transform:rotate(calc(var(--tilt,0deg) * -1));transition:transform 1.1s var(--spring)}
.p-scales .pan-l{transform-box:view-box;transform-origin:36px 44px;transform:rotate(calc(var(--tilt,0deg) * -1));transition:transform 1.1s var(--spring)}
.p-scales.idle .beam{animation:wob 4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.p-scales .readout{text-align:center;font-family:var(--mono);font-size:.7em;margin-top:.4em;color:var(--ink-2)}

/* gavel */
.p-gavel{width:17em}
.p-gavel svg{width:100%;overflow:visible}
.gv-wood{fill:var(--wood);stroke:var(--ink);stroke-width:4}
.gv-band{fill:var(--teal-l);stroke:var(--ink);stroke-width:3}
.gv-block{fill:#6B4426;stroke:var(--ink);stroke-width:4}
.gv-hammer{transform-box:view-box;transform-origin:226px 72px;transform:rotate(-24deg)}
.gv-hit path{fill:none;stroke:var(--teal-d);stroke-width:5;stroke-linecap:round;opacity:0}
.p-gavel.idle .gv-hammer{animation:knock 4.5s var(--ease) 1s infinite}
.p-gavel.idle .gv-hit path{animation:hit 4.5s var(--ease) 1s infinite}
.p-gavel.strike .gv-hammer{animation:knock1 .7s var(--ease)}
.p-gavel.strike .gv-hit path{animation:hit1 .7s var(--ease)}
@keyframes knock{0%,70%,100%{transform:rotate(-24deg)}78%{transform:rotate(4deg)}86%{transform:rotate(-24deg)}}
@keyframes hit{0%,76%,100%{opacity:0}80%{opacity:1}90%{opacity:0}}
@keyframes knock1{0%{transform:rotate(-24deg)}40%{transform:rotate(4deg)}100%{transform:rotate(-24deg)}}
@keyframes hit1{0%,30%{opacity:0}45%{opacity:1}80%,100%{opacity:0}}

/* keyboard corner */
.p-keys{width:22em;position:relative}
.kb{direction:ltr;background:linear-gradient(160deg,#D9DDE2,#AEB5BE);border-radius:1.2em;padding:.9em;box-shadow:0 1.6em 2.6em rgba(19,35,58,.28),inset 0 .15em 0 rgba(255,255,255,.7);transform:perspective(60em) rotateX(22deg) rotate(-12deg);display:grid;grid-template-columns:repeat(5,1fr);gap:.55em}
.kc{height:3.6em;border-radius:.55em;background:linear-gradient(180deg,#FBFBF9,#E6E4DD);border:.08em solid #C9C5BA;box-shadow:0 .32em 0 #ACA89C,0 .5em .8em rgba(19,35,58,.18);display:flex;align-items:flex-start;justify-content:flex-start;padding:.45em .55em;font-family:var(--mono);font-weight:600;font-size:.9em;color:#3A4656}
.kc.w2{grid-column:span 2}
.kc.hot{grid-column:span 2;background:linear-gradient(180deg,#86EEEA,var(--teal-l));border-color:var(--teal-d);box-shadow:0 .32em 0 var(--teal-d),0 .5em .8em rgba(19,35,58,.18);color:var(--ink);font-family:var(--display);font-size:1.45em;line-height:.95;direction:rtl;text-align:right;padding:.35em .45em;white-space:normal}
.p-keys.idle .kc.hot{animation:press 3.4s var(--ease) infinite}
.p-keys.press .kc.hot{animation:press1 .45s var(--ease)}
@keyframes press{0%,78%,100%{transform:none}84%{transform:translateY(.28em);box-shadow:0 .06em 0 var(--teal-d)}}
@keyframes press1{50%{transform:translateY(.28em);box-shadow:0 .06em 0 var(--teal-d)}}

/* chat */
.p-chat{width:18em;background:#fff;border:.13em solid var(--ink);box-shadow:.35em .35em 0 var(--ink);display:flex;flex-direction:column;gap:.6em;padding:0 0 1em}
.c-head{display:flex;align-items:center;gap:.6em;padding:.6em .8em;border-bottom:.12em solid var(--ink);font-weight:700;font-size:.8em}
.c-ava{width:2em;height:2em;border-radius:50%;background:var(--teal-l);border:.12em solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-size:.75em;font-weight:600}
.c-on{width:.55em;height:.55em;border-radius:50%;background:#22B07D;margin-inline-start:auto;box-shadow:0 0 0 .2em rgba(34,176,125,.2)}
.c-msg{max-width:82%;padding:.55em .8em;font-size:.82em;line-height:1.4;margin-inline:.8em}
.c-bot{align-self:flex-start;background:#EEF3F6;border-radius:.2em 1em 1em 1em;animation:popin .5s var(--spring) .3s both}
.c-me{align-self:flex-end;background:var(--teal-l);border:.1em solid var(--ink);border-radius:1em .2em 1em 1em;animation:popin .45s var(--spring) both}
.c-typing{align-self:flex-end;margin-inline:.8em;display:none;gap:.25em;padding:.5em .7em;background:#EEF3F6;border-radius:1em}
.c-typing.show{display:flex}
.c-typing i{width:.45em;height:.45em;border-radius:50%;background:var(--ink-2);animation:dots 1s infinite}
.c-typing i:nth-child(2){animation-delay:.15s}.c-typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-.2em)}}

/* calendar */
.p-cal{width:13em;position:relative;transform:rotate(3deg)}
.cal{background:#fff;box-shadow:0 1em 2em rgba(19,35,58,.2);position:relative;perspective:40em}
.cal-top{height:2.2em;background:var(--ink);display:flex;justify-content:space-around;align-items:center}
.cal-top i{width:.7em;height:1.6em;border-radius:.35em;background:linear-gradient(90deg,#9AA3AD,#F1F4F6,#9AA3AD);margin-top:-1.2em}
.cal-month{background:var(--teal);color:#fff;text-align:center;font-weight:800;font-size:1em;padding:.3em 0;letter-spacing:.05em}
.cal-day{text-align:center;font-family:var(--display);font-weight:700;font-size:6.4em;line-height:1;padding-top:.05em}
.cal-note{text-align:center;font-family:var(--mono);font-size:.62em;padding:0 0 1em;color:var(--ink-2)}
.cal-sheet{position:absolute;inset:2.2em 0 0;background:#fff;transform-origin:top;backface-visibility:hidden;opacity:0;border-top:.1em dashed #ccc}
.p-cal.flip .cal-sheet{animation:tear .9s var(--ease)}
@keyframes tear{0%{opacity:1;transform:rotateX(0)}100%{opacity:0;transform:rotateX(-110deg) translateY(-1em)}}

/* contract */
.p-contract{width:15em;transform:rotate(-2deg)}
.ct-page{background:#fff;box-shadow:0 1em 2em rgba(19,35,58,.18);padding:1.4em 1.3em 1.2em;display:flex;flex-direction:column;gap:.55em;position:relative}
.ct-page::before{content:"";position:absolute;inset:0 auto 0 1.6em;width:.08em;background:rgba(164,67,47,.35)}
.ct-title{font-family:var(--display);font-weight:700;font-size:1.9em;line-height:1;text-align:center;margin-bottom:.15em}
.ct-l{height:.42em;background:#E3E9EE}
.ct-l.hl{background:linear-gradient(90deg,var(--teal-l),var(--teal-l)) no-repeat right/0% 100%,#E3E9EE;animation:clause 1.4s var(--ease) .6s forwards}
@keyframes clause{to{background-size:100% 100%,auto}}
.ct-sign{margin-top:.6em;border-top:.1em solid var(--ink);padding-top:.3em;display:flex;flex-direction:column;align-items:flex-start}
.ct-sign svg{width:8em;height:2.4em;margin-top:-2.3em}
.ct-sign path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420}
.on .ct-sign path,.p-contract.sign .ct-sign path{animation:draw 1.6s var(--ease) .8s forwards}
.p-contract.sign .ct-sign path{animation:redraw 1.6s var(--ease) forwards}
@keyframes redraw{0%{stroke-dashoffset:420}100%{stroke-dashoffset:0}}
.ct-sign span{font-family:var(--mono);font-size:.55em;color:var(--ink-2)}
.ct-chips{display:flex;flex-wrap:wrap;gap:.3em;min-height:1.4em}
.ct-chips b{font-size:.6em;background:var(--mint);border:.1em solid var(--ink);padding:.1em .5em;font-weight:600;animation:popin .4s var(--spring) both}

/* sticky note */
.p-note{width:15em;min-height:13em;background:var(--note);padding:1.6em 1.3em 1.2em;transform:rotate(-3deg);box-shadow:0 1.2em 1.8em -1em rgba(19,35,58,.4),0 .1em .2em rgba(0,0,0,.08);position:relative;animation:sway 6s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-1.4deg)}}
.p-note::before{content:"";position:absolute;top:-.7em;left:50%;width:5em;height:1.4em;transform:translateX(-50%) rotate(2deg);background:rgba(61,220,216,.55)}
.n-title{font-family:var(--hand);font-weight:700;font-size:2em;line-height:1;margin:0 0 .3em}
.n-text{font-family:var(--hand);font-weight:700;font-size:1.6em;line-height:1.15;margin:0;color:#2B3A4E;min-height:2.4em;word-break:break-word}
.n-text:empty::before{content:"…";opacity:.4}

/* laptop */
.p-laptop{width:20em}
.lp-screen{background:var(--ink);border:.5em solid #2A3A50;border-radius:.8em .8em 0 0;aspect-ratio:16/10;position:relative;overflow:hidden;padding:1em}
.lp-lines{display:flex;flex-direction:column;gap:.5em;margin-top:3.6em}
.lp-lines i{height:.4em;background:rgba(255,255,255,.12)}
.lp-lines i:nth-child(2){width:70%}.lp-lines i:nth-child(3){width:85%}
.lp-toast{position:absolute;top:.8em;inset-inline:.8em;background:#fff;border-radius:.5em;padding:.6em .7em;display:flex;gap:.6em;align-items:flex-start;animation:toast .6s var(--spring) .5s both}
.lp-toast.in{animation:toast .6s var(--spring) both}
@keyframes toast{from{opacity:0;transform:translateY(-120%)}}
.lp-dot{flex:none;width:1.6em;height:1.6em;border-radius:.4em;background:var(--teal-l);border:.1em solid var(--ink)}
.lp-toast b{display:block;font-size:.7em}
.lp-toast p{margin:.1em 0 0;font-size:.68em;color:var(--ink-2)}
.lp-base{height:1em;background:linear-gradient(180deg,#C7CED6,#9AA4AE);border-radius:0 0 1.2em 1.2em;margin:0 -1.4em;position:relative}
.lp-base::after{content:"";position:absolute;top:0;left:50%;width:4em;height:.4em;transform:translateX(-50%);background:#8A949E;border-radius:0 0 .4em .4em}

/* =================== DESIGN STYLES (S.style) ===================
   desk     : living office desk, dotted paper, condensed display type (default)
   document : elegant legal document, ruled paper, serif headlines
   minimal  : clean and quiet, plain ground, strong sans headlines
   bold     : colourful and loud, mint ground, thick outlines                */
body.style-document .app{background-color:#FAFCFC;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(10,134,134,.09) 31px 32px)}
body.style-document .title{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:900;line-height:1.05;font-size:clamp(40px,7vw,76px)}
body.style-document .hero .title{font-size:clamp(50px,11vw,120px)}
body.style-document .eyebrow{color:var(--ink-2)}
body.style-document mark.hl{background-image:linear-gradient(transparent 82%,var(--teal) 82%,var(--teal) 92%,transparent 92%)}
body.style-document .opt{box-shadow:0 2px 0 rgba(19,35,58,.5),0 6px 14px rgba(19,35,58,.06);border-color:rgba(19,35,58,.55)}
body.style-minimal .app{background-image:none;background-color:#F6FBFB}
body.style-minimal .title{font-family:var(--body);font-weight:900;letter-spacing:-.02em;line-height:1.08;font-size:clamp(34px,6vw,64px)}
body.style-minimal .hero .title{font-size:clamp(44px,9vw,104px)}
body.style-minimal .opt{border-color:rgba(19,35,58,.18);box-shadow:0 1px 2px rgba(19,35,58,.08)}
body.style-minimal .opt[aria-checked="true"]{border-color:var(--teal-d);box-shadow:0 0 0 3px rgba(61,220,216,.35)}
body.style-minimal .rail-top,body.style-minimal .rail-bottom{border-color:rgba(19,35,58,.15)}
body.style-bold .app{background-color:#E3F8F6;background-image:radial-gradient(rgba(10,134,134,.28) 1.4px,transparent 1.6px);background-size:22px 22px}
body.style-bold .opt{border-width:2.5px;box-shadow:0 6px 0 var(--ink)}
body.style-bold .opt[aria-checked="true"]{background:var(--teal-l)}
body.style-bold mark.hl{background-image:linear-gradient(transparent 40%,var(--teal-l) 40%,var(--teal-l) 95%,transparent 95%)}
body.style-bold .rail-top{background:var(--teal-l)}
body.style-bold .btn-go{background:var(--ink);color:#fff}

/* animation levels */
body.anim-low body.anim-low .p-note,body.anim-low .p-folder .f-paper,body.anim-low .p-scales.idle .beam,body.anim-low .p-gavel.idle *,body.anim-low .p-keys.idle .kc.hot,body.anim-low .d-cursor,body.anim-low .btn-go.ready{animation:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>

<div class="app" id="app">
  <header class="rail rail-top">
    <img class="logo" id="logo" alt="Legal Mind">
    <span class="meta" id="meta"></span>
    <span class="counter" id="counter"></span>

  <main class="pages" id="pages" aria-live="polite"></main>

  </div>

    var cards=ends.map(function(c){return '<div class="end"><span class="e-eyebrow">'+bidi(c.badge||c.eyebrow||"")+'</span><h3>'+bidi(c.title)+'</h3><p>'+bidi(c.text)+'</p><a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+(c.kind==="whatsapp"?ICON_WA:ICON_WEB)+bidi(c.button)+"</a></div>";}).join("");
    var prop=propHtml(t);
    return '<div class="q-grid'+(prop?"":" solo")+'"><div class="prop-zone'+(prop?"":" none")+'" aria-hidden="true">'+prop+'</div><div class="q-main"><span class="eyebrow">'+esc(t.kicker||"נשלח")+'</span><h2 class="title">'+rich(already?(t.alreadyTitle||"כבר *מילאתם*"):(t.title||"*תודה* רבה!"))+'</h2><p class="sub">'+rich(already?(t.alreadyText||"התשובות שלכם כבר אצלנו."):(t.text||"התשובות התקבלו."))+'</p>'+(cards?'<div class="ends">'+cards+"</div>":"")+"</div></div>";}

  /* ---------- mount ---------- */
  document.getElementById("logo").src=window.LOGO;
  document.getElementById("meta").textContent=S.meta||"";
  document.getElementById("policy").innerHTML=window.PRIVACY_HTML||"";
  var ticks=document.getElementById("ticks");for(var i=0;i<Q.length;i++)ticks.appendChild(document.createElement("i"));
  // test mode is announced inside the top rail, where it never covers the content
  if(S.testMode){var mt=document.getElementById("meta");mt.textContent=S.demoLabel||"דמו: התשובות לא נשמרות";mt.style.color="var(--stamp)";mt.style.fontWeight="600";}
  if(st.submitted&&!S.testMode)pages=[{kind:"thanks",already:true}];

  pages.forEach(function(p){var el=document.createElement("section");el.className="page "+(p.kind==="welcome"?"welcome":p.kind==="thanks"?"thanks":"");
    el.innerHTML=p.kind==="welcome"?welcomeHtml():p.kind==="q"?qHtml(p):p.kind==="details"?detailsHtml():thanksHtml(p.already);
    p.el=el;root.appendChild(el);
    if(p.kind==="q")wireQ(p);if(p.kind==="details")wireDetails(p);
    if(p.kind==="welcome")el.querySelector("[data-start]").addEventListener("click",function(){go(cur+1);});});

  var navEl=document.getElementById("nav"),nextBtn=document.getElementById("next"),backBtn=document.getElementById("back"),counter=document.getElementById("counter");
  nextBtn.addEventListener("click",function(){var p=pages[cur];if(p.tryNext)p.tryNext();});
  backBtn.addEventListener("click",function(){if(cur>0)go(cur-1,true);});

  function refreshProp(p){var t=ptype(p.kind==="q"?p.q:p.kind==="details"?(S.details||{}):null);if(!t)return;var z=p.el.querySelector(".prop-zone");
    if(t==="card"||t==="folder"){refreshFields(z,p.q&&p.q.id);var nm=answerOf("name"),n=z.querySelector(".mc-name");if(n&&nm){n.textContent=nm;n.classList.remove("empty");}}}
  function go(i,rev){var prev=pages[cur];if(prev&&i!==cur){prev.el.classList.remove("on");prev.el.classList.toggle("rev",!!rev);prev.el.classList.add("out");setTimeout(function(){prev.el.classList.remove("out","rev");},600);}
    cur=i;var p=pages[i];p.el.classList.toggle("rev",!!rev);p.el.scrollTop=0;void p.el.offsetWidth;p.el.classList.add("on");p.el.classList.remove("rev");
    refreshProp(p);
    var isQ=p.kind==="q",isD=p.kind==="details";
    navEl.hidden=!(isQ||isD);
    counter.textContent=isQ?pad(p.n)+" / "+pad(Q.length):isD?"פרטים":p.kind==="thanks"?"✓":pad(Q.length)+" שאלות";
    [].forEach.call(ticks.children,function(t,k){t.classList.toggle("on",isQ?k<p.n:isD||p.kind==="thanks");});
    nextBtn.innerHTML=isD?esc((S.details||{}).button||"שליחה")+' <span aria-hidden="true">←</span>':'המשך <span aria-hidden="true">←</span>';
    if(p.sync)p.sync();
    setTimeout(function(){var f=p.el.querySelector(".opt,textarea,input:not([tabindex='-1'])");if(f&&matchMedia("(pointer:fine)").matches)f.focus({preventScroll:true});},420);}

  /* ---------- question wiring ---------- */
  function wireQ(p){var q=p.q,el=p.el,err=el.querySelector(".err"),zone=el.querySelector(".prop-zone"),t=ptype(q),timer=null;
    var a=st.answers[q.id]||(st.answers[q.id]={choice:[],other:"",text:"",value:null});
    var ow=el.querySelector(".other-wrap"),oi=el.querySelector(".other-in"),ta=el.querySelector("textarea");
    function valid(){if(q.type==="choice"){if(!a.choice.length)return q.required?"בחרו תשובה כדי להמשיך":"";if(a.choice.indexOf((q.options||[]).length)>-1&&!String(a.other||"").trim())return "בחרתם \"אחר\". כתבו בבקשה את התשובה.";}
      if(q.type==="scale"&&a.value==null&&q.required)return "בחרו מספר כדי להמשיך";
      if(q.type==="open"&&q.required&&String(a.text||"").trim().length<2)return "כתבו כמה מילים כדי להמשיך";return "";}
    function paint(){el.querySelectorAll(".opt").forEach(function(b){var on=q.type==="scale"?String(a.value)===b.dataset.v:a.choice.indexOf(+b.dataset.i)>-1;b.setAttribute("aria-checked",on?"true":"false");});
      if(ow)ow.classList.toggle("show",a.choice.indexOf((q.options||[]).length)>-1);}
    function sync(){paint();var ok=!valid();nextBtn.disabled=false;nextBtn.classList.toggle("ready",ok);}
    function react(idx){if(t&&PROPS[t])PROPS[t].update(zone,q,answerText(q),idx);}
    p.sync=sync;
    p.tryNext=function(){clearTimeout(timer);if(pages[cur]!==p)return;var m=valid();if(m){err.textContent=m;return;}err.textContent="";go(cur+1);};
    if(oi){oi.value=a.other||"";oi.addEventListener("input",function(){a.other=oi.value;err.textContent="";save();sync();});oi.addEventListener("change",function(){react(a.choice[a.choice.length-1]);});
      oi.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();p.tryNext();}});}
    if(ta){ta.value=a.text||"";ta.addEventListener("input",function(){a.text=ta.value;err.textContent="";save();sync();clearTimeout(timer);timer=setTimeout(function(){react(-1);},250);});}
    el.addEventListener("click",function(e){var b=e.target.closest(".opt");if(!b)return;err.textContent="";
      if(q.type==="scale"){a.value=+b.dataset.v;}else{var i=+b.dataset.i,at=a.choice.indexOf(i);if(q.multiple){if(at>-1)a.choice.splice(at,1);else a.choice.push(i);}else a.choice=[i];
        if(b.classList.contains("other")&&a.choice.indexOf(i)>-1)setTimeout(function(){oi.focus();},50);}
      save();sync();react(q.type==="scale"?a.value:+b.dataset.i);
      // a single answer moves on by itself; with a prop there is a short pause so the object can react.
      // "Other" never auto-advances: the viewer types the answer and presses Continue.
      clearTimeout(timer);
      if(S.autoAdvance!==false&&!q.multiple&&q.type!=="open"&&!b.classList.contains("other"))timer=setTimeout(p.tryNext,t?1050:450);});
    if(answerText(q))setTimeout(function(){react(-1);},50);}

  /* ---------- details ---------- */
  var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  function wireDetails(p){var el=p.el,zone=el.querySelector(".prop-zone"),t=ptype(S.details||{}),touched={},tried=false;
    var priv=el.querySelector("#c-privacy"),mk=el.querySelector("#c-marketing"),ferr=el.querySelector("[data-ferr]"),miss=el.querySelector("[data-missing]");
    var NAMES={firstName:"שם פרטי",lastName:"שם משפחה",email:"מייל תקין",phone:"טלפון תקין"};
    function check(k){var inp=el.querySelector("#f-"+k);if(!inp)return "";var v=inp.value.trim();
      if(k==="firstName"&&v.length<2)return "צריך למלא שם פרטי";if(k==="lastName"&&v.length<2)return "צריך למלא שם משפחה";
      if(k==="email"){if(v.indexOf("@")===-1)return "כתובת המייל חייבת לכלול את הסימן @";if(!EMAIL.test(v))return "כתובת המייל לא תקינה. בדקו שיש בה שם, @ ודומיין, למשל name@gmail.com";}
      if(k==="phone"){if(!v&&collect.phone!=="required")return "";if(!/^0\d{8,9}$/.test(v.replace(/[\s\-()]/g,"").replace(/^\+972/,"0")))return "מספר הטלפון לא תקין";}return "";}
    function update(){var m=[];["firstName","lastName","email","phone"].forEach(function(k){var f=el.querySelector('[data-f="'+k+'"]');if(!f)return;var e=check(k);if(e)m.push(NAMES[k]);var show=e&&(touched[k]||tried);f.classList.toggle("bad",!!show);f.querySelector(".err").textContent=show?e:"";});
      if(priv&&!priv.checked)m.push("אישור מדיניות הפרטיות");
      // hard stop: the send button stays disabled until every required field is valid and the privacy box is ticked
      nextBtn.disabled=m.length>0;nextBtn.classList.toggle("ready",!m.length);miss.textContent=m.length?"כדי לשלוח חסר: "+m.join(", "):"";}
    ["firstName","lastName","email","phone"].forEach(function(k){var inp=el.querySelector("#f-"+k);if(!inp)return;inp.value=st.details[k]||"";
      inp.addEventListener("input",function(){st.details[k]=inp.value;save();update();if(t&&PROPS[t]&&(k==="firstName"||k==="lastName"))PROPS[t].update(zone,{id:"name"},"");});
      inp.addEventListener("blur",function(){touched[k]=true;update();});
      inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();p.tryNext();}});});
    if(priv)priv.addEventListener("change",function(){st.consentAt=priv.checked?new Date():null;update();});
    el.querySelector("[data-policy]").addEventListener("click",openPolicy);
    p.sync=update;
    p.tryNext=function(){if(pages[cur]!==p)return;tried=true;update();if(nextBtn.disabled)return;
      if(el.querySelector("#f-website").value){go(cur+1);return;}
      nextBtn.disabled=true;nextBtn.textContent="שולח…";ferr.textContent="";
      send(mk&&mk.checked).then(function(){st.submitted=true;save();go(cur+1);}).catch(function(){nextBtn.disabled=false;nextBtn.innerHTML='שליחה <span aria-hidden="true">←</span>';ferr.textContent="השליחה לא הצליחה. בדקו את החיבור לאינטרנט ונסו שוב.";});};}

  function ilTime(d){try{return new Intl.DateTimeFormat("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);}catch(e){return d.toISOString();}}
  function getIp(){if(S.logIp===false)return Promise.resolve("");return Promise.race([fetch("https://api.ipify.org?format=json").then(function(r){return r.json();}).then(function(j){return j.ip||"";}),new Promise(function(r){setTimeout(function(){r("");},2500);})]).catch(function(){return "";});}
  function send(mkOk){var qs=new URLSearchParams(location.search);
    return getIp().then(function(ip){var d=st.details;var payload={surveyId:S.id,surveyTitle:plain(S.title),test:!!S.testMode,
      firstName:(d.firstName||"").trim(),lastName:(d.lastName||"").trim(),email:(d.email||"").trim().toLowerCase(),phone:(d.phone||"").trim(),
      consentPrivacy:S.consentMode==="notice"?"הודעה הוצגה":"כן",consentAt:S.consentMode==="notice"?ilTime(new Date()):(st.consentAt?ilTime(new Date(st.consentAt)):""),
      consentText:S.consentMode==="notice"?(S.noticeText||"בשליחת הסקר אני מאשר/ת שקראתי את ")+(S.consentLinkText||"מדיניות הפרטיות"):(S.consentText||"קראתי ואני מסכים/ה ל")+(S.consentLinkText||"מדיניות הפרטיות"),
      policyVersion:S.policyVersion||"",consentMarketing:collect.marketingConsent?(mkOk?"כן":"לא"):"",ip:ip,source:qs.get("src")||qs.get("utm_source")||"",campaign:qs.get("utm_campaign")||"",
      userAgent:navigator.userAgent.slice(0,200),clientTime:ilTime(new Date()),
      questions:Q.map(function(q){return{id:q.id,title:plain(q.title),type:q.type,multiple:!!q.multiple,answer:answerText(q)};})};
      window.__lastPayload=payload;
      if(!S.endpoint)return new Promise(function(r){setTimeout(r,600);});
      // text/plain avoids a CORS preflight, which Google Apps Script does not answer
      return fetch(S.endpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});});}

  /* ---------- modal & keys ---------- */
  var modal=document.getElementById("modal"),lastF=null;
  function openPolicy(){lastF=document.activeElement;modal.hidden=false;modal.querySelector(".btn-go").focus();}
  function closePolicy(){modal.hidden=true;if(lastF)lastF.focus();}
  modal.addEventListener("click",function(e){if(e.target===modal||e.target.closest("[data-close]"))closePolicy();});
  document.addEventListener("keydown",function(e){if(!modal.hidden){if(e.key==="Escape")closePolicy();return;}
    var p=pages[cur],tag=(e.target.tagName||"").toLowerCase();
    if(e.key==="Enter"&&tag!=="textarea"&&tag!=="button"&&tag!=="input"){if(p.kind==="welcome"){e.preventDefault();go(cur+1);}else if(p.tryNext){e.preventDefault();p.tryNext();}}
    if(p.kind==="q"&&tag!=="input"&&tag!=="textarea"&&/^[1-9]$/.test(e.key)){var b=p.el.querySelectorAll(".opt")[+e.key-1];if(b)b.click();}});

  go(0);
})();
</script>
